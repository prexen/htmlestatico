name: seas-fecam
services:
  site:
    image: fecam:1.0.0
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    cpus: "0.50"
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
